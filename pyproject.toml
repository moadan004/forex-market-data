[project]
name = "forex-market-data"
version = "0.1.0"
description = "Historical Forex market-data ingestion and quality pipeline"
readme = "README.md"
authors = [
    { name = "moadan340", email = "moadan340@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
]

[project.scripts]
marketdata = "marketdata.cli:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "marketdata"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]
